name: Revision Verify

on:
  push:
    branches:
      - revision/v4-runtime-consolidation
  pull_request:
    branches:
      - main

concurrency:
  group: revision-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Web build
        run: npm run build

      - name: Android web bundle
        run: npm run build:android
